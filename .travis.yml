language: java

jdk:
  - openjdk17

os:
  - linux

before_cache:
  - rm -f $HOME/.gradle/caches/modules-2/modules-2.lock
cache:
  directories:
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/

script: ./gradlew build --console=plain --no-build-cache -I gradle/seal-test-summary.gradle

after_script:
  - sh .travis/wait-for-log.sh
