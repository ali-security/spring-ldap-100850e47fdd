name: PR Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task + selector to run instead of the full build (e.g. :spring-ldap-core:test --tests FooTest)'
        required: false
        default: ''

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'spring-projects/spring-ldap' || github.repository_owner == 'ali-security'
    strategy:
      matrix:
        jdk: [17]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
          cache: 'gradle'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
      - name: Print per-test results and disable the Gradle build cache
        run: |
          mkdir -p ~/.gradle/init.d
          cp gradle/seal-test-summary.gradle ~/.gradle/init.d/
          echo "org.gradle.caching=false" >> ~/.gradle/gradle.properties
      - name: Build with Gradle
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew clean assemble ${{ inputs.test-filter }} --no-daemon --stacktrace
          else
            ./gradlew clean build --no-daemon --stacktrace
          fi
      - name: Upload spring-ldap-core jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-ldap-core-jar
          path: |
            core/build/libs/spring-ldap-core-*.jar
            !core/build/libs/*-sources.jar
            !core/build/libs/*-javadoc.jar
          if-no-files-found: error
